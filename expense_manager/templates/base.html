<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Manager{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --navy: #172554;
            --background: #f4f7fc;
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --green: #16a34a;
            --red: #dc2626;
            --radius: 14px;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        nav {
            background: var(--navy);
            color: white;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        nav a {
            color: #e2e8f0;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            background: #334779;
            color: white;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
            min-height: 70vh;
        }

        h1, h2, h3 {
            line-height: 1.3;
        }

        h1 {
            font-size: clamp(25px, 4vw, 34px);
            margin-bottom: 5px;
        }

        h2 {
            font-size: 23px;
        }

        p {
            color: var(--muted);
        }

        .card {
            background: var(--white);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
            border: 1px solid #edf0f5;
            margin-bottom: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .grid .card {
            margin-bottom: 0;
        }

        .amount {
            font-size: clamp(22px, 3vw, 29px);
            font-weight: 750;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .income {
            color: var(--green);
        }

        .expense {
            color: var(--red);
        }

        .balance {
            color: var(--primary);
        }

        form {
            width: 100%;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 12px 0 5px;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            margin-right: 8px;
        }

        .helptext {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 12px;
        }

        .errorlist {
            color: var(--red);
            font-size: 13px;
            list-style: none;
            margin-bottom: 8px;
        }

        button, .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 11px 19px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        button:hover, .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .delete-btn {
            background: var(--red);
        }

        .edit-btn {
            background: var(--green);
        }

        .logout-btn {
            background: #2563eb;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            font-weight: 700;
            color: #334155;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .auth-card {
            max-width: 460px;
            width: 100%;
            margin: 55px auto;
            padding: 32px;
        }

        .auth-card h2 {
            margin-bottom: 8px;
        }

        .auth-card > p {
            margin-bottom: 20px;
        }

        .auth-card button {
            width: 100%;
            margin-top: 5px;
        }

        .auth-card a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .auth-card a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 14px 17px;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            nav {
                padding: 15px 4%;
            }

            .container {
                width: 94%;
            }
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 5%;
            }

            nav h2 {
                font-size: 22px;
            }

            .nav-links {
                width: 100%;
                gap: 5px;
            }

            nav a {
                font-size: 13px;
                padding: 8px;
                margin: 0;
            }

            .container {
                width: 92%;
                margin: 22px auto;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin: 20px 0;
            }

            .card {
                padding: 19px;
            }

            .auth-card {
                margin: 25px auto;
                padding: 23px;
            }

            .amount {
                font-size: 25px;
            }

            th, td {
                padding: 12px;
                font-size: 14px;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn,
            .actions button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    
<nav>
    <h2>Expense Manager</h2>
    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'expense_list' %}">Transactions</a>
            <a href="{% url 'add_expense' %}">Add Transaction</a>

            <form method="POST" action="{% url 'logout' %}" style="width:auto;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
